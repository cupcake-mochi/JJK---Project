<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Área de proteção do Bastião">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 Z" fill="#BC2A6E"/></marker></defs>
<rect width="960" height="260" rx="8" fill="#FDF0F6"/>
<circle cx="230" cy="130" r="108" fill="#FADDEA" stroke="#BC2A6E" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="230" y1="130" x2="230" y2="22" stroke="#9A6F87" stroke-width="2"/>
<text x="240" y="54" font-family="sans-serif" font-size="15" fill="#251727">6 m de raio</text>
<circle cx="230" cy="130" r="15" fill="#2B1B2E"/>
<text x="215" y="168" font-family="sans-serif" font-weight="bold" font-size="16" fill="#251727">Kaori</text>
<circle cx="284" cy="130" r="12" fill="#fff" stroke="#2B1B2E" stroke-width="3"/>
<text x="272" y="105" font-family="sans-serif" font-size="15" fill="#251727">Aliado</text>
<path d="M311 119 L323 130 L311 141 L300 130 Z" fill="#BC2A6E"/>
<path d="M327 148 L374 190 L410 190" fill="none" stroke="#BC2A6E" stroke-width="1.8"/>
<text x="417" y="196" font-family="sans-serif" font-size="16" fill="#251727">Maldição</text>
<path d="M308 145 Q298 182 286 146" fill="none" stroke="#BC2A6E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495" y="64" font-family="sans-serif" font-weight="bold" font-size="19" fill="#251727">O alcance é conferido contra o aliado.</text>
<text x="495" y="104" font-family="sans-serif" font-size="17" fill="#251727">Kaori até o aliado: 3 m.</text>
<text x="495" y="137" font-family="sans-serif" font-size="17" fill="#251727">Maldição até o aliado: 1,5 m.</text>
<text x="495" y="180" font-family="sans-serif" font-size="17" fill="#251727">Ao assumir o golpe, Kaori fica no lugar.</text>
<text x="495" y="224" font-family="sans-serif" font-size="14" fill="#847B86">Esquema de posições; os símbolos não indicam tamanho.</text>
</svg>
